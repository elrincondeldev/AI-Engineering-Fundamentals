[project]
name = "m09-reasoning"
version = "0.1.0"
description = "Module 09 lab: reasoning models, inference-time scaling, verifiers and training loops (simulated, offline)."
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
lab = "m09_reasoning.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/m09_reasoning"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
