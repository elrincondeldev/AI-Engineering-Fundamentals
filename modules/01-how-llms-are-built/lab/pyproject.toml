[project]
name = "m01-foundations"
version = "0.1.0"
description = "Module 01 lab: clean a web crawl, train a BPE tokenizer, run attention in numpy, count parameters."
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=1.26"]

[project.scripts]
lab = "m01_foundations.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/m01_foundations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
