[project]
name = "m02-post-training"
version = "0.1.0"
description = "Module 02 lab: decoding strategies, SFT data, reward models, DPO and LLM evaluation."
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.0"]

[project.scripts]
lab = "m02_post_training.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/m02_post_training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
