[project]
name = "m04-adaptation"
version = "0.1.0"
description = "Module 04 lab: route Hearthwise support tickets with prompting, context engineering and LoRA."
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.0"]

[project.scripts]
lab = "m04_adaptation.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/m04_adaptation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
