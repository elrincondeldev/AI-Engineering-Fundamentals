[project]
name = "m00-skeleton"
version = "0.1.0"
description = "Lab skeleton: copy this folder to modules/NN-slug/lab and rename the package."
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/m00_skeleton"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
